<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Top boarding schools in Canada methodology</title>
<desc id="desc">Ranking methodology weights: CAIS directory status 35%, Program breadth 20%, Boarding provision 20%, Student support 15%, Source recency 10%.</desc>
<rect width="1200" height="420" fill="#f7f5ef"/>
<text x="70" y="75" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#15283b">Top boarding schools in Canada methodology</text>
<text x="70" y="115" font-family="Arial, sans-serif" font-size="19" fill="#52606d">Disclosed weighting used for this comparison; no paid placement in this guide</text>
<rect x="70.0" y="190" width="371.0" height="70" fill="#1f496e"/>
<text x="255.5" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">35%</text>
<rect x="441.0" y="190" width="212.0" height="70" fill="#d6a94b"/>
<text x="547.0" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">20%</text>
<rect x="653.0" y="190" width="212.0" height="70" fill="#64816e"/>
<text x="759.0" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">20%</text>
<rect x="865.0" y="190" width="159.0" height="70" fill="#8a6075"/>
<text x="944.5" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">15%</text>
<rect x="1024.0" y="190" width="106.0" height="70" fill="#567a96"/>
<text x="1077.0" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">10%</text>
<rect x="70" y="300" width="18" height="18" rx="3" fill="#1f496e"/>
<text x="98" y="315" font-family="Arial, sans-serif" font-size="17" fill="#263746">CAIS directory status (35%)</text>
<rect x="435" y="300" width="18" height="18" rx="3" fill="#d6a94b"/>
<text x="463" y="315" font-family="Arial, sans-serif" font-size="17" fill="#263746">Program breadth (20%)</text>
<rect x="800" y="300" width="18" height="18" rx="3" fill="#64816e"/>
<text x="828" y="315" font-family="Arial, sans-serif" font-size="17" fill="#263746">Boarding provision (20%)</text>
<rect x="70" y="338" width="18" height="18" rx="3" fill="#8a6075"/>
<text x="98" y="353" font-family="Arial, sans-serif" font-size="17" fill="#263746">Student support (15%)</text>
<rect x="435" y="338" width="18" height="18" rx="3" fill="#567a96"/>
<text x="463" y="353" font-family="Arial, sans-serif" font-size="17" fill="#263746">Source recency (10%)</text>
