<title id="title">Top 100 high schools in the USA methodology</title>
<desc id="desc">Ranking methodology weights: Academics 60%, Culture and diversity 12.5%, Parent and student surveys 10%, Teachers 10%, Clubs and activities 2.5%, Resources and facilities 2.5%, Sports 2.5%.</desc>
