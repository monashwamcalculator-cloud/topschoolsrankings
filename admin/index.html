<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Top Schools Rankings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f8f9fa; color: #1a202c; padding: 40px; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h1 { margin-top: 0; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input[type="text"], input[type="password"], textarea { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 4px; box-sizing: border-box; }
    textarea { min-height: 200px; font-family: monospace; }
    button { background: #003366; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #002244; }
    button:disabled { background: #cbd5e0; cursor: not-allowed; }
    #login-screen, #dashboard { display: none; }
    #login-screen.active, #dashboard.active { display: block; }
    .error { color: #e53e3e; margin-top: 10px; }
    .success { color: #38a169; margin-top: 10px; }
    .tabs { margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .tabs button { background: none; color: #4a5568; padding: 5px 10px; font-size: 14px; font-weight: normal; margin-right: 10px; border-bottom: 2px solid transparent; border-radius: 0; }
    .tabs button.active { color: #003366; border-bottom-color: #003366; font-weight: bold; }
    .tabs button:hover { background: #f8f9fa; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div id="login-screen" class="active">
      <h1>Admin Login</h1>
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" id="password" placeholder="Enter admin password">
      </div>
      <button onclick="login()">Login</button>
      <div id="login-message"></div>
    </div>

    <div id="dashboard">
      <h1>Admin Dashboard</h1>
      <button onclick="logout()" style="float:right; padding: 5px 10px; font-size: 12px;">Logout</button>
      
      <div class="tabs">
        <button class="active" onclick="switchTab('create')">Create Article</button>
        <button onclick="switchTab('delete')">Delete Article</button>
      </div>

      <div id="tab-create" class="tab-content active">
        <div class="form-group">
          <label>URL Slug (e.g. top-10-schools-in-dubai)</label>
          <input type="text" id="slug" placeholder="Required">
        </div>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" placeholder="Required">
        </div>
        <div class="form-group">
          <label>Meta Description</label>
          <input type="text" id="desc" placeholder="Optional">
        </div>
        <div class="form-group">
          <label>Featured Image URL (e.g. /media/articles/my-image.webp)</label>
          <input type="text" id="image" placeholder="Optional">
        </div>
        <div class="form-group">
          <label>Content (HTML)</label>
          <textarea id="content" placeholder="<p>Write your article HTML here...</p>"></textarea>
        </div>
        <button id="create-btn" onclick="submitArticle('create')">Publish Article</button>
        <div id="create-message"></div>
      </div>

      <div id="tab-delete" class="tab-content">
        <div class="form-group">
          <label>URL Slug to Delete (e.g. top-10-schools-in-dubai)</label>
          <input type="text" id="delete-slug" placeholder="Required">
          <p style="font-size:12px; color:#718096;">Warning: This will permanently delete the article directory and remove it from the blogs feed and sitemap.</p>
        </div>
        <button id="delete-btn" onclick="submitArticle('delete')" style="background:#e53e3e;">Delete Article</button>
        <div id="delete-message"></div>
      </div>

    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      event.target.classList.add('active');
    }

    function login() {
      const pass = document.getElementById('password').value;
      if (pass) {
        localStorage.setItem('admin_pass', pass);
        document.getElementById('login-screen').classList.remove('active');
        document.getElementById('dashboard').classList.add('active');
      }
    }

    function logout() {
      localStorage.removeItem('admin_pass');
      document.getElementById('password').value = '';
      document.getElementById('dashboard').classList.remove('active');
      document.getElementById('login-screen').classList.add('active');
    }

    if (localStorage.getItem('admin_pass')) {
      login();
    }

    async function submitArticle(action) {
      const password = localStorage.getItem('admin_pass');
      const btn = document.getElementById(action + '-btn');
      const msg = document.getElementById(action + '-message');
      
      let payload = { action, password };

      if (action === 'create') {
        payload.slug = document.getElementById('slug').value.trim();
        payload.title = document.getElementById('title').value.trim();
        payload.desc = document.getElementById('desc').value.trim();
        payload.image = document.getElementById('image').value.trim();
        payload.content = document.getElementById('content').value.trim();
        if (!payload.slug || !payload.title || !payload.content) {
          msg.innerHTML = '<span class="error">Please fill in Slug, Title, and Content.</span>';
          return;
        }
      } else if (action === 'delete') {
        payload.slug = document.getElementById('delete-slug').value.trim();
        if (!payload.slug) {
          msg.innerHTML = '<span class="error">Please provide a slug to delete.</span>';
          return;
        }
        if (!confirm('Are you sure you want to delete /' + payload.slug + '/ ? This cannot be undone.')) return;
      }

      btn.disabled = true;
      msg.innerHTML = '<span>Processing... (This takes about 5-10 seconds to commit to GitHub)</span>';

      try {
        const res = await fetch('/api/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        
        if (res.ok) {
          msg.innerHTML = '<span class="success">' + data.message + ' (Vercel is now building your site, changes will be live in ~2 minutes).</span>';
          if (action === 'create') {
            document.getElementById('slug').value = '';
            document.getElementById('title').value = '';
            document.getElementById('desc').value = '';
            document.getElementById('image').value = '';
            document.getElementById('content').value = '';
          } else {
            document.getElementById('delete-slug').value = '';
          }
        } else {
          msg.innerHTML = '<span class="error">Error: ' + data.error + '</span>';
          if (res.status === 401) logout();
        }
      } catch (err) {
        msg.innerHTML = '<span class="error">Network error: ' + err.message + '</span>';
      }
      
      btn.disabled = false;
    }
  </script>
</body>
</html>
