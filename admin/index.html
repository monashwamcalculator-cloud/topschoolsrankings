<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Schools Rankings | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; width: 20px; height: 20px; animation: spin 1s ease-in-out infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-800">Admin Login</h1>
                <p class="text-sm text-gray-500 mt-2">Sign in to manage your articles</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
                </div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none">
                    Log In
                </button>
            </form>
            <p id="login-error" class="mt-4 text-sm text-red-600 text-center hidden">Invalid credentials</p>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="hidden min-h-screen">
        <nav class="bg-gray-800 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <span class="font-bold text-xl">Top Schools Rankings</span>
                    </div>
                    <div class="flex items-center">
                        <button onclick="logout()" class="text-sm bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded-md">Log Out</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-5xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            <div class="bg-white rounded-lg shadow px-6 py-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Write a New Post</h2>
                
                <form id="post-form" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Post Title</label>
                        <input type="text" id="post-title" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:border-blue-500 text-lg" required>
                    </div>

                    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Category</label>
                            <select id="post-category" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:border-blue-500" required>
                                <option value="UK">UK</option>
                                <option value="Australia">Australia</option>
                                <option value="USA">USA</option>
                                <option value="Canada">Canada</option>
                                <option value="India">India</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Featured Image</label>
                            <input type="file" id="post-image" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Author Name</label>
                            <input type="text" id="author-name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:border-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Author Image (Optional)</label>
                            <input type="file" id="author-image" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Author Bio</label>
                        <textarea id="author-bio" rows="2" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:border-blue-500" required></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Article Content (HTML or Markdown)</label>
                        <textarea id="post-content" rows="15" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:border-blue-500 font-mono text-sm" placeholder="Write your content here..." required></textarea>
                    </div>

                    <div class="pt-4 border-t border-gray-200">
                        <button type="submit" id="publish-btn" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none">
                            Publish Article
                        </button>
                    </div>
                    
                    <div id="publish-status" class="mt-4 text-center hidden p-4 rounded-md"></div>
                </form>
            </div>
        </main>
    </div>

    <script>
        // Store credentials in memory
        let currentAuth = null;

        // Convert file to base64
        const toBase64 = file => new Promise((resolve, reject) => {
            if (!file) return resolve(null);
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve({
                name: file.name,
                data: reader.result.split(',')[1]
            });
            reader.onerror = error => reject(error);
        });

        // Login Handler
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            // Basic frontend check just to transition. Backend does real check.
            if (u && p) {
                currentAuth = { username: u, password: p };
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
            }
        });

        // Logout
        function logout() {
            currentAuth = null;
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        // Post Submit Handler
        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('publish-btn');
            const statusDiv = document.getElementById('publish-status');
            
            // UI Loading state
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Publishing (Please wait, this takes 10-15s)...';
            statusDiv.classList.add('hidden');

            try {
                // Get Base64 images
                const featureFile = document.getElementById('post-image').files[0];
                const authorFile = document.getElementById('author-image').files[0];
                
                const featureBase64 = await toBase64(featureFile);
                const authorBase64 = await toBase64(authorFile);

                const payload = {
                    auth: currentAuth,
                    title: document.getElementById('post-title').value,
                    category: document.getElementById('post-category').value,
                    author_name: document.getElementById('author-name').value,
                    author_bio: document.getElementById('author-bio').value,
                    content: document.getElementById('post-content').value,
                    feature_image: featureBase64,
                    author_image: authorBase64
                };

                const res = await fetch('/api/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    statusDiv.className = 'mt-4 text-center p-4 rounded-md bg-green-100 text-green-800';
                    statusDiv.innerHTML = `<strong>Success!</strong> Article published successfully. It will be live at <a href="/${data.slug}/" target="_blank" class="underline">/${data.slug}/</a> in about 1-2 minutes once Vercel finishes building.`;
                    statusDiv.classList.remove('hidden');
                    document.getElementById('post-form').reset();
                } else {
                    if (res.status === 401) {
                        logout();
                        alert('Incorrect Username or Password! Please login again.');
                    } else {
                        throw new Error(data.error || 'Unknown error occurred');
                    }
                }
            } catch (err) {
                statusDiv.className = 'mt-4 text-center p-4 rounded-md bg-red-100 text-red-800';
                statusDiv.innerText = `Error: ${err.message}`;
                statusDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Publish Article';
            }
        });
    </script>
</body>
</html>
